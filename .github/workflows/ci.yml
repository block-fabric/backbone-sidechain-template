# Build the node (no window) and run the unit tests.

name: CI
on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Ubuntu: build and unit tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkgconf python3 \
            libevent-dev libboost-dev libsqlite3-dev libzmq3-dev

      - name: Configure
        run: cmake -B build -DBUILD_WEBUI=OFF

      - name: Build
        run: cmake --build build -j4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -j4
